services:
  episense-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: episense-prod-api
    ports:
      - "8001:8000"
    env_file:
      - .env
    restart: always
    mem_limit: 2g
    cpus: "1.0" # oversubscription: api + dashboard cpus=2.0 may exceed host cores; intentional for burst, relies on host scheduler
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./config:/app/config:ro
  episense-dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: episense-dashboard
    ports:
      - "8501:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
    restart: always
    # Cabeçalho de CPU para o auto-retreino in-container (8 workers single-thread,
    # scripts/train.py). 1 CPU fazia o ciclo completo levar ~1h; 4 CPUs ≈ 6-8 min.
    mem_limit: 3000m
    cpus: "4.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

x-auth-environment: &auth-environment
  EPISENSE_AUTH_DB: /app/auth-state/attempts.sqlite3

services:
  episense-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: episense-prod-api
    ports:
      - "8001:8000"
    environment: *auth-environment
    env_file:
      - .env
    restart: always
    mem_limit: 2g
    cpus: "1.0" # oversubscription: api + dashboard cpus=2.0 may exceed host cores; intentional for burst, relies on host scheduler
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - auth-state:/app/auth-state
      - ./data:/app/data
      - ./models:/app/models
      - ./config:/app/config:ro
  episense-dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: episense-dashboard
    ports:
      - "8501:8000"
    environment: *auth-environment
    env_file:
      - .env
    volumes:
      - auth-state:/app/auth-state
      - ./data:/app/data
      - ./models:/app/models
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ./logs:/app/logs
    restart: always
    # Cabeçalho de CPU para o auto-retreino in-container (8 workers single-thread,
    # scripts/train.py). 1 CPU fazia o ciclo completo levar ~1h; 4 CPUs ≈ 6-8 min.
    mem_limit: 3000m
    cpus: "4.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  dourados-api:
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      <<: *auth-environment
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    restart: unless-stopped
    volumes: &dourados-volumes
      - auth-state:/app/auth-state
      - ./cities/5003702/config.yaml:/app/config/config.yaml:ro
      - ./cities/5003702/processed:/app/data/processed
      - ./cities/5003702/raw:/app/data/raw
      - ./cities/5003702/pilot:/app/city-models
      - ./cities/5003702/logs:/app/logs
      - ./scripts:/app/scripts:ro
  dourados-dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment: *auth-environment
    env_file: .env
    restart: unless-stopped
    volumes: *dourados-volumes
  corumba-api:
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      <<: *auth-environment
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    restart: unless-stopped
    volumes: &corumba-volumes
      - auth-state:/app/auth-state
      - ./cities/5003207/config.yaml:/app/config/config.yaml:ro
      - ./cities/5003207/processed:/app/data/processed
      - ./cities/5003207/raw:/app/data/raw
      - ./cities/5003207/pilot:/app/city-models
      - ./cities/5003207/logs:/app/logs
      - ./scripts:/app/scripts:ro
  corumba-dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment: *auth-environment
    env_file: .env
    restart: unless-stopped
    volumes: *corumba-volumes

volumes:
  auth-state:

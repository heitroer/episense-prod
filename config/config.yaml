project:
  name: Episense
  location: Campo Grande, MS
  geocode: '5002704'
  disease: dengue
  target_variable: casos
  se_format: YYYYWW
paths:
  data_raw: data/raw
  data_processed: data/processed
  models: models
  logs: logs
  api: api
data_sources:
  infodengue:
    base_url: https://info.dengue.mat.br/api/alertcity
    geocode: '5002704'
    disease: dengue
    format: csv
    ew_format: SE
  openmeteo:
    base_url: https://archive-api.open-meteo.com/v1/archive
    latitude: -20.4697
    longitude: -54.6201
    timezone: America/Campo_Grande
    daily_variables:
    - temperature_2m_max
    - temperature_2m_min
    - temperature_2m_mean
    - precipitation_sum
    - relative_humidity_2m_mean
    - wind_speed_10m_max
features:
  target_transform: log1p
  legacy_convention:
    log_lag1_shift: 0
    log_lagn_shift: 1
    temp_lag2_shift: 1
    temp_lag4_shift: 3
    p_rt1_rt_nivel_lag1_shift: 2
  advanced_convention:
    log_lag1_shift: 1
    log_lagn_shift: 1
  lags:
    cases:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    temperature:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    precipitation:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    humidity:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
  rolling_windows:
  - 3
  - 4
  - 8
  - 12
  seasonal_features: true
  interaction_features: true
  horizon_features: true
  expand_seasonal: true
  expand_weather_long: true
  expand_extra: false
  expand_climatology: true
  expand_trend: true
  expand_outbreak: true
  expand_regime_conditional: true
  expand_peak_timing: true
targets:
  horizons:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
  target_cols:
  - target_h1
  - target_h2
  - target_h3
  - target_h4
  target_transform: log1p
model:
  type: LightGBM
  ensemble:
    n_seeds: 5
    seeds:
    - 42
    - 123
    - 456
    - 789
    - 999
    aggregation: mean
  hyperparameters:
    objective: tweedie
    tweedie_variance_power: 1.5
    metric: rmse
    boosting_type: gbdt
    num_leaves: 127
    max_depth: 10
    learning_rate: 0.03
    n_estimators: 3000
    subsample: 0.85
    colsample_bytree: 0.85
    reg_alpha: 0.05
    reg_lambda: 0.05
    min_child_samples: 15
    random_state: 42
    verbosity: -1
    early_stopping_rounds: 150
    feature_fraction: 0.85
    bagging_fraction: 0.85
    bagging_freq: 3
    min_gain_to_split: 0.01
training:
  start_year: 2014
  walk_forward:
    n_splits: 4
    test_size_weeks: 52
    gap_weeks: 8
    expanding_window: true
    min_train_weeks: 100
    test_years:
    - 2022
    - 2023
    - 2024
    - 2025
    epidemiological_folds: true
    fold_start_month: 9
    fold_end_month: 8
  validation:
    gap_weeks: 4
    expanding: true
  feature_selection:
    method: importance
    threshold: 0.001
    max_features: 380
    per_quantile: true
    separate_quantile_features: true
    expand_extra: false
    threshold_per_quantile:
      0.05: 0.001
      0.25: 0.001
      0.5: 0.001
      0.75: 0.001
      0.95: 0.001
    max_features_per_quantile:
      0.05: 250
      0.25: 250
      0.5: 380
      0.75: 250
      0.95: 250
  temporal_weighting:
    enabled: true
    half_life_years: 6.58
  peak_weighting:
    enabled: true
    weight_200: 1.3
    weight_500: 1.8
    weight_1000: 2.2
  gap_per_horizon: true
  parallel_horizons:
    enabled: true
    n_jobs: 8
    backend: loky
    worker_threads: 1
  quantile_hparams:
    0.05:
      num_leaves: 63
      max_depth: 8
      min_child_samples: 15
      learning_rate: 0.03
      reg_alpha: 0.05
      reg_lambda: 0.05
      min_gain_to_split: 0.005
      feature_fraction: 0.85
      bagging_fraction: 0.85
      bagging_freq: 3
    0.5: {}
    0.95:
      num_leaves: 63
      max_depth: 8
      min_child_samples: 15
      learning_rate: 0.03
      reg_alpha: 0.05
      reg_lambda: 0.05
      min_gain_to_split: 0.005
      feature_fraction: 0.85
      bagging_fraction: 0.85
      bagging_freq: 3
    0.25:
      num_leaves: 63
      max_depth: 8
      min_child_samples: 15
      learning_rate: 0.03
      reg_alpha: 0.05
      reg_lambda: 0.05
      min_gain_to_split: 0.005
      feature_fraction: 0.85
      bagging_fraction: 0.85
      bagging_freq: 3
    0.75:
      num_leaves: 63
      max_depth: 8
      min_child_samples: 15
      learning_rate: 0.03
      reg_alpha: 0.05
      reg_lambda: 0.05
      min_gain_to_split: 0.005
      feature_fraction: 0.85
      bagging_fraction: 0.85
      bagging_freq: 3
  scaler:
    type: DataFrameScaler
    feature_range:
    - 0
    - 1
quantiles:
- 0.05
- 0.25
- 0.5
- 0.75
- 0.95
non_crossing:
  enabled: true
  method: post_process
phantom_gating:
  enabled: true
  calm_q95_max_factor: 3.5
  outbreak_q95_max_factor: 4.0
asymmetric_loss:
  enabled: false
  horizon_threshold: 5
  undershoot_weight: 1.35
  overshoot_weight: 1.0
  only_median: true
epidemiological_periods:
  outbreak_months:
  - 10
  - 11
  - 12
  - 1
  - 2
  - 3
  - 4
  - 5
  calm_months:
  - 6
  - 7
  - 8
  - 9
inference:
  horizon_specific_features: true
  feature_alignment: strict
  scaler_path: models/scaler.pkl
  model_paths:
    h1: models/lgbm_h1_seed{seed}_q{tau}.pkl
    h2: models/lgbm_h2_seed{seed}_q{tau}.pkl
    h3: models/lgbm_h3_seed{seed}_q{tau}.pkl
    h4: models/lgbm_h4_seed{seed}_q{tau}.pkl
    h5: models/lgbm_h5_seed{seed}_q{tau}.pkl
    h6: models/lgbm_h6_seed{seed}_q{tau}.pkl
    h7: models/lgbm_h7_seed{seed}_q{tau}.pkl
    h8: models/lgbm_h8_seed{seed}_q{tau}.pkl
  feature_list_path: models/feature_list.json
  legacy_feature_aliases: true
api:
  host: 0.0.0.0
  port: 8000
  host_external: localhost
  port_external: 8000
  geocode: '5002704'
  request_body:
    required_fields:
    - geocode
    optional_fields: []
  response:
    format: json
    fields:
    - horizonte_semanas
    - semana_epidemiologica
    - casos_previstos
    - alerta
    alert_thresholds:
      h1:
      - 10
      - 50
      - 100
      h2:
      - 10
      - 50
      - 100
      h3:
      - 10
      - 50
      - 100
      h4:
      - 10
      - 50
      - 100
      h5:
      - 10
      - 50
      - 100
      h6:
      - 10
      - 50
      - 100
      h7:
      - 10
      - 50
      - 100
      h8:
      - 10
      - 50
      - 100
    horizon_guidance: 'h1-h4: previsoes principais de magnitude (confianca media-alta).
      h5-h8: sinal de alerta precoce - mais confiaveis em anos de baixa incidencia;
      em anos de surto atipico (ex.: 2019, 45k casos) subestimam a magnitude. Nao
      tratar h5-h8 como verdade absoluta.'
    alert_labels:
    - baixo
    - medio
    - alto
    - critico

model:
  type: LightGBM
  ensemble:
    n_seeds: 5
    seeds:
    - 42
    - 123
    - 456
    - 789
    - 999
    aggregation: mean
  hyperparameters:
    objective: tweedie
    tweedie_variance_power: 1.5
    metric: rmse
    boosting_type: gbdt
    num_leaves: 63  # 127->63 regularizacao: reduz complexidade da arvore p/ evitar overfit
    max_depth: 8  # 10->8 limita profundidade
    learning_rate: 0.03
    n_estimators: 3000
    subsample: 0.85
    colsample_bytree: 0.85
    reg_alpha: 0.3  # 0.05->0.3 L1 maior penalidade
    reg_lambda: 0.3  # 0.05->0.3 L2 maior penalidade
    min_child_samples: 20  # 15->20 folha precisa mais amostras
    random_state: 42
    verbosity: -1
    early_stopping_rounds: 150
    feature_fraction: 0.85
    bagging_fraction: 0.85
    bagging_freq: 3
    min_gain_to_split: 0.05  # 0.01->0.05 exige ganho minimo maior p/ split
training:
  start_year: 2014
  walk_forward:
    n_splits: 4
    test_size_weeks: 52
    gap_weeks: 8
    expanding_window: true
    min_train_weeks: 100
    test_years:
    - 2022
    - 2023
    - 2024
    - 2025
    epidemiological_folds: true
    fold_start_month: 9
    fold_end_month: 8
  validation:
    gap_weeks: 4
    expanding: true
  feature_selection:
    # Dimensionalidade reduzida 380->120 (max_features) e per-quantile 250/380->80/120
    # threshold 0.001->0.005 filtra features de baixa importancia (ruido) e reduz overfit/variancia
    method: importance
    threshold: 0.005
    max_features: 120
    per_quantile: true
    separate_quantile_features: true  # mantido true mas com limites menores (80/120) p/ caudas
    # always_keep: features de regime GARANTIDAS na seleção (sobrevivem ao corte por ganho).
    # Nominações filtradas por existência em runtime; omitem-se nomes que a engenharia não gera.
    # Motivo (relatório out/2026, P1/P3/P4): sinais de regime (YTD-ratio, YoY, growth,
    # slopes, anomalias) são os que permitem antecipar picos/quedas rápidas.
    always_keep:
      - log_casos_ytd            # fase da temporada corrente (cumulativo log)
      - ytd_share_prev_year      # razão YTD corrente vs ano anterior (regime!)
      - log_ytd_ratio            # log-razão YTD (versão simétrica)
      - ytd_ratio_roll4          # razão YTD suavizada 4 semanas
      - log_casos_yoy52          # YoY semana igual ano anterior
      - log_casos_yoy52_gated    # YoY com gating anti-phantom
      - log_casos_yoy53          # YoY ano-53
      - log_casos_growth_ratio_4 # crescimento 4 semanas (razão)
      - log_casos_growth_ratio_1 # crescimento 1 semana (razão)
      - log_casos_momentum_4     # momentum 4 semanas
      - log_casos_slope_accel_4  # aceleração da tendência curta
      - log_casos_accel_8        # aceleração 8 semanas
      - log_casos_anomaly_clim   # anomalia vs climatologia de casos
      - trend_vs_clim_8          # tendência vs climatologia 8 semanas
      - log_casos_vs_ewma_8      # posição vs EWMA 8s (proxy R efetiva)
      - casos_ytd_rate           # ritmo de acumulação (semana do ano)
    expand_extra: false
    threshold_per_quantile:
      0.05: 0.005
      0.25: 0.005
      0.5: 0.005
      0.75: 0.005
      # q95: limiar relaxado 0.035->0.01 e teto 10->40 (out/2026): a cauda anterior
      # ficava com ~22 feats e não condicionava a largura ao regime (banda 29x a
      # mediana em semanas calmas; y>q95 ~0-4% vs 5% nominal). Correção da Fase 2
      # -- grid do cap do conformal (1.0/1.3/1.5) foi neutro/negativo no expanding
      # e foi rejeitado.
      0.95: 0.01
    max_features_per_quantile:
      0.05: 80
      0.25: 80
      0.5: 120
      0.75: 80
      0.95: 40
    # Overrides por horizonte (v4, out/2026): em h6-h8 a cauda condicionada de 40
    # feats ficou ESTREITA demais no surto (cov90 raw 0.94->0.72-0.81) e o conformal
    # nesses horizontes degrada WIS (+12-22%); restaura-se a cauda fina original
    # (thr 0.035 / mf 10, cov90 0.89-0.94, largura grande) apenas para h6-h8.
    # v5: h5 incluída no override — no retreino v4, h5 condicionada ficou pior em
    # AMBOS os critérios (cov90 0.88->0.76 E WIS 27.1->29.4 vs cauda fina).
    threshold_per_quantile_per_horizon:
      "5": {"0.95": 0.035}
      "6": {"0.95": 0.035}
      "7": {"0.95": 0.035}
      "8": {"0.95": 0.035}
    max_features_per_quantile_per_horizon:
      "5": {"0.95": 10}
      "6": {"0.95": 10}
      "7": {"0.95": 10}
      "8": {"0.95": 10}
    # v6 (Rt, Codeço et al. 2018 via InfoDengue): a família rt_*/p_rt1_* ganha em
    # h1 (WIS -0.4%, w90 -7%), h3 (MAE -6.7%), h4 (MAE -0.9%/WIS -2.7%) e h8
    # (MAE -8.9%) — mas regride de forma DETERMINÍSTICA em h2 (MAE +12.3%) e
    # h5 (MAE +8.2%/WIS +7.1%), e é neutra-sem-ganho em h6/h7. Ban por
    # horizonte: Rt entra só nos horizontes vencedores (prefixo/startswith).
    banned_features_per_horizon:
      "2": ["rt_", "p_rt1_"]
      "5": ["rt_", "p_rt1_"]
      "6": ["rt_", "p_rt1_"]
      "7": ["rt_", "p_rt1_"]
  temporal_weighting:
    enabled: true
    half_life_years: 3.5
    half_life_years_long: 10.0  # 6.0->10 h5-8 preserva 2019 para h8 ETP, mas q95 sem peak_weight compensa
  peak_weighting:
    enabled: true
    weight_200: 1.3
    weight_500: 1.4  # 1.8->1.4 reduz peso excessivo de picos medios (evita 4x peso combinado)
    weight_1000: 1.8  # 2.2->1.8 reduz peso de picos extremos
  gap_per_horizon: true
  parallel_horizons:
    enabled: true
    n_jobs: 8
    backend: loky
    worker_threads: 1
  quantile_hparams:
    # Regularização leve para caudas: corrige hiperinflação q95 sem underfit (n_tr 360-480)
    # 0.05/0.95: leaves 31/depth 6/min_child 30/lambda 1.5 vs mediana 63/8/20/0.3
    0.05:
      num_leaves: 31
      max_depth: 6
      min_child_samples: 30
      learning_rate: 0.025
      reg_alpha: 0.8
      reg_lambda: 1.5
      min_gain_to_split: 0.02
      feature_fraction: 0.75
      bagging_fraction: 0.75
      bagging_freq: 3
    0.5: {}
    0.95:
      num_leaves: 10
      max_depth: 4
      min_child_samples: 60
      learning_rate: 0.02
      reg_alpha: 2.0
      reg_lambda: 5.0
      min_gain_to_split: 0.05
      feature_fraction: 0.60
      bagging_fraction: 0.75
      bagging_freq: 3
    0.25:
      num_leaves: 63
      max_depth: 8
      min_child_samples: 15
      learning_rate: 0.03
      reg_alpha: 0.3
      reg_lambda: 0.3
      min_gain_to_split: 0.005
      feature_fraction: 0.85
      bagging_fraction: 0.85
      bagging_freq: 3
    0.75:
      num_leaves: 63
      max_depth: 8
      min_child_samples: 15
      learning_rate: 0.03
      reg_alpha: 0.3
      reg_lambda: 0.3
      min_gain_to_split: 0.005
      feature_fraction: 0.85
      bagging_fraction: 0.85
      bagging_freq: 3
  scaler:
    type: DataFrameScaler
    feature_range:
    - 0
    - 1
quantiles:
- 0.05
- 0.25
- 0.5
- 0.75
- 0.95
non_crossing:
  enabled: true
  method: post_process
quantile_recalibration:
  # LEGADO (substituída por quantile_conformal abaixo). enabled=false: deltas
  # legacy não são regenerados e não são aplicados em inference (fallback inerte).
  enabled: false
  method: holdout
quantile_conformal:
  # CQR (conformized quantile regression) DELTA-ONLY por horizonte x regime-base.
  # Regime = intensidade OBSERVÁVEL da semana-base (casos), decidível em produção.
  # Evidência dos experimentos out/2026 (expanding, por fold): cov90 h1 0.82->0.90,
  # MAE estável (fold1 0.77->0.88, fold3 0.80->0.92); delta-only em h6-h8 cruza
  # regimes contraditórios entre temporadas e degrada WIS. h4 ambíguo pós-retreino
  # (f1 cov90 0.81->0.94 MAS f3 0.65->0.56 / cov50 0.37->0.15) => excluído; h5
  # melhora todos os folds (f1 0.85->0.90, f2 0.94->1.00, f3 0.58->0.73) => incluído.
  # Median shift desabilitado (transfere mal a amplitude entre temporadas).
  # Valid honesta: expanding (fold calibrado só com folds anteriores) no recompute.
  enabled: true
  half_life_years: 2.5
  max_abs_delta: 1.0
  apply_horizons: [1, 2, 3, 5]
  apply_median_shift: false
  max_abs_median_shift: 0.8
  regime_thresholds:
    high: 100.0   # casos na semana-base => cluster 'high' (surto instalado)
    mid: 20.0     # 20-100 => 'mid'; <20 => 'low' (endemia baixa)
deployment_gate:
  # Gate de implantação por fold (P7): exige MAE de CADA fold completo (>=52 sem)
  # <= max_baseline_ratio * baseline sazonal; se reprovar, update_pipeline.py
  # faz rollback e NÃO promove o retreino (estado md5 não avança, sem restart).
  enabled: true
  max_baseline_ratio: 1.35
phantom_gating:
  enabled: true
  calm_q95_max_factor: 1.5  # 1.8->1.5 corta 2000 vs 700 (calm cap 1.5× mediana) aceita h1 +2% para h8 ETP 10→4
  outbreak_q95_max_factor: 2.0  # 2.5->2.0
  disabled_horizons: []
# horizon_weights disabled: pesos iguais por horizonte evita overfit
horizon_weights:
  enabled: false
# asymmetric_loss: desabilitado — teste com 1.25 piorou FBias (-0.19→-0.34 em h2). Subestimação é estrutural (mediana < média em distribuição assimétrica)
# Solução para viés levemente superestimador será via correção post-hoc leve em inference (fator 1.08) e não via loss assimétrica.
asymmetric_loss:
  enabled: false
  horizon_threshold: 2
  undershoot_weight: 1.0
  overshoot_weight: 1.0
  only_median: true

    log_lagn_shift: 1
    temp_lag2_shift: 1
    temp_lag4_shift: 3
    p_rt1_rt_nivel_lag1_shift: 2
  advanced_convention:
    log_lag1_shift: 1
    log_lagn_shift: 1
  lags:
    cases:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    temperature:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    precipitation:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    humidity:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
  rolling_windows:
  - 3
  - 4
  - 8
  - 12
  seasonal_features: true
  interaction_features: true
  horizon_features: true
  expand_seasonal: true
  expand_weather_long: true
  expand_extra: false
  expand_climatology: true
  expand_trend: true
  expand_rt: true
  expand_outbreak: true
  expand_regime_conditional: true
  expand_peak_timing: true
targets:
  horizons:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
  target_cols:
  - target_h1
  - target_h2
  - target_h3
  - target_h4

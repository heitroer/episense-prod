}
.city {cursor:pointer}
.terrain {fill:#167a75;stroke:#61e7d7;stroke-width:1.7;pointer-events:none;transition:transform 180ms ease-out,fill 180ms ease-out}

<script>
const key = 'episense_api_token';
const entry = document.getElementById('entry');
const form = document.getElementById('entry-form');
const input = document.getElementById('entry-token');
const status = document.getElementById('entry-status');

async function verifyAccess(token) {
  try {
    const response = await fetch('/api/auth/check', {
      cache: 'no-store', headers: token ? {'X-API-Key': token} : {}
    });
    if (response.ok) {
      if (token) sessionStorage.setItem(key, token);
      entry.hidden = true;
      document.querySelector('header').hidden = false;
      document.querySelector('main').hidden = false;
      return;
    }
    if (response.status === 429) {
      const seconds = Number(response.headers.get('Retry-After')) || 30;
      status.textContent = 'Muitas tentativas. Tente novamente em ' + seconds + ' s.';
      form.hidden = false;
      return;
    }
    status.textContent = response.status === 401
      ? (token ? 'Token inválido. Confira o valor e tente novamente.' : '')
      : 'Acesso indisponível. Tente novamente.';
  } catch {
    status.textContent = 'Acesso indisponível. Tente novamente.';
  }
  form.hidden = false;
}
form.addEventListener('submit', async event => {
  event.preventDefault();
  const button = form.querySelector('button');
  button.disabled = true;
  await verifyAccess(input.value.trim());
  button.disabled = false;
});
verifyAccess(sessionStorage.getItem(key));

const territory = document.querySelector('.territory');
const map = territory.ownerSVGElement;

function trackZoomCenter(event) {
  if (event.pointerType !== 'mouse') return;
  const matrix = map.getScreenCTM();
  if (!matrix) return;
  // Use the unscaled SVG coordinates to keep the point under the cursor fixed.
  const point = new DOMPoint(event.clientX, event.clientY).matrixTransform(matrix.inverse());
  territory.style.setProperty('--zoom-x', point.x + 'px');
  territory.style.setProperty('--zoom-y', point.y + 'px');
}

const panel = territory.closest('.map-panel');
panel.addEventListener('pointerenter', trackZoomCenter);
panel.addEventListener('pointermove', trackZoomCenter);
</script>
